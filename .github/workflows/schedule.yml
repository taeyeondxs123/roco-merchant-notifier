name: Run notifier
on:
  workflow_dispatch:
  schedule:
    - cron: '1 0,4,8,12 * * *'

jobs:
  run-notifier:
    runs-on: ubuntu-latest
    env:
      ROCOM_API_KEY: ${{ secrets.ROCOM_API_KEY }}
      IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      NOTIFYME_UUID: ${{ secrets.NOTIFYME_UUID }}
      CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Run Notifier Script
        run: python main.py
        env:
          PYTHONIOENCODING: utf-8
